<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200"><style>
@keyframes gpsc-fade{from{opacity:0}to{opacity:1}}
@keyframes gpsc-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes gpsc-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gpsc-pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes gpsc-wipe{from{transform:translateX(calc(-1 * var(--gpsc-w,420px)))}to{transform:translateX(0)}}
@keyframes gpsc-tint{from{filter:sepia(.7) saturate(4) hue-rotate(-70deg)}to{filter:sepia(0) saturate(1) hue-rotate(0)}}
@keyframes gpsc-rgb{0%{filter:hue-rotate(0deg) saturate(1)}50%{filter:hue-rotate(180deg) saturate(1.7)}100%{filter:hue-rotate(360deg) saturate(1)}}.gpsc-item{animation:gpsc-fade 1.25s ease both}.arc{animation:gpsc-pop 1.5s ease both;transform-box:fill-box;transform-origin:center}rect.bar{animation:gpsc-grow 2.5s cubic-bezier(.2,.7,.3,1) both;transform-box:fill-box;transform-origin:center bottom}.gpsc-reveal{animation:gpsc-wipe 2.5s linear both}@media (prefers-reduced-motion:reduce){.gpsc-root,.gpsc-root *,.gpsc-item,.gpsc-chart,rect.bar,.arc,.gpsc-reveal{animation:none!important}}</style><style>* {
          font-family: 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif
        }</style><g class="gpsc-root"><rect x="1" y="1" rx="5" ry="5" height="99%" width="99.41176470588235%" stroke="#000000" stroke-width="1" fill="#000000" stroke-opacity="0"></rect><text x="30" y="40" class="gpsc-item" style="--gpsc-i: 0; font-size: 22px; fill: #9745f5;">Top Languages by Commit</text><g transform="translate(0,40)"><g transform="translate(40,0)"><rect y="18" width="14" height="14" class="gpsc-item" style="--gpsc-i: 0; stroke-width: 1px;" fill="#3572A5" stroke="#000000"></rect><rect y="43.2" width="14" height="14" class="gpsc-item" style="--gpsc-i: 1; stroke-width: 1px;" fill="#3178c6" stroke="#000000"></rect><rect y="68.4" width="14" height="14" class="gpsc-item" style="--gpsc-i: 2; stroke-width: 1px;" fill="#e34c26" stroke="#000000"></rect><text x="16.8" y="30" class="gpsc-item" style="--gpsc-i: 0; fill: #ffffff; font-size: 14px;">Python</text><text x="16.8" y="55.2" class="gpsc-item" style="--gpsc-i: 1; fill: #ffffff; font-size: 14px;">TypeScript</text><text x="16.8" y="80.4" class="gpsc-item" style="--gpsc-i: 2; fill: #ffffff; font-size: 14px;">HTML</text></g><g transform="translate( 230, 80 )"><g class="arc" style="--gpsc-i: 0;"><path d="M3.67394039744206e-15,-60A60,60,0,1,1,-33.334213981176134,-49.888176738152715L-19.444958155686077,-29.101436430589082A35,35,0,1,0,2.1431318985078682e-15,-35Z" style="fill: #3572A5; stroke-width: 2px;" stroke="#000000"></path></g><g class="arc" style="--gpsc-i: 1;"><path d="M-33.334213981176134,-49.888176738152715A60,60,0,0,1,-10.050373398284169,-59.152261111094155L-5.862717815665765,-34.505485648138254A35,35,0,0,0,-19.444958155686077,-29.101436430589082Z" style="fill: #3178c6; stroke-width: 2px;" stroke="#000000"></path></g><g class="arc" style="--gpsc-i: 2;"><path d="M-10.050373398284169,-59.152261111094155A60,60,0,0,1,-1.1021821192326178e-14,-60L-6.429395695523604e-15,-35A35,35,0,0,0,-5.862717815665765,-34.505485648138254Z" style="fill: #e34c26; stroke-width: 2px;" stroke="#000000"></path></g></g></g></g></svg>