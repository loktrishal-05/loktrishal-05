name: Profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contribution snake — purple palette
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7B2FF7&color_dots=#EDE4F7,#E0AAFF,#C77DFF,#9D4EDD,#5A189A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C77DFF&color_dots=#1A0B2E,#3C096C,#5A189A,#9D4EDD,#E0AAFF

      # 3D contribution calendar — purple theme
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json

      # Summary cards (contribution graph, langs, productive time) — midnight purple
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5.5
          AUTO_PUSH: false
          THEME: midnight_purple
          ANIMATION: draw

      - run: |
          mkdir -p dist/profile-3d-contrib dist/cards
          cp profile-3d-contrib/*.svg dist/profile-3d-contrib/
          cp profile-summary-card-output/midnight_purple/*.svg dist/cards/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "⚡ update recent activity"
          MAX_LINES: 5
