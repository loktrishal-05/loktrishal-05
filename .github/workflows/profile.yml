name: Profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write

concurrency: profile-assets

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contribution snake — starlight palette
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0284C7&color_dots=#E2E8F0,#BAE6FD,#7DD3FC,#38BDF8,#0284C7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F8FAFC&color_dots=#172334,#23445E,#327399,#7DD3FC,#F1F5F9

      # 3D contribution calendar — starlight theme
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json

      # Summary cards (contribution graph, langs, productive time) — GitHub dark
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5.5
          AUTO_PUSH: false
          THEME: github_dark
          ANIMATION: draw

      - run: |
          sudo chown -R $USER dist
          mkdir -p dist/profile-3d-contrib dist/cards
          cp profile-3d-contrib/*.svg dist/profile-3d-contrib/
          cp profile-summary-card-output/github_dark/*.svg dist/cards/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "⚡ update recent activity"
          MAX_LINES: 5
